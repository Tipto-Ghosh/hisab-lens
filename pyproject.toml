[project]
name = "hisab-lens"
version = "0.1.0"
description = "HisabLens: Extract validated, structured JSON from invoices and receipts using a fine-tuned vision-language model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.2.0",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "huggingface-hub>=2.5.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "opencv-python-headless>=5.1.0.95",
    "peft>=0.22.0",
    "pillow>=13.0.0",
    "qwen-vl-utils>=0.0.14",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.3",
    "timm>=1.0.31",
    "tokenizers>=0.23.3",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers>=5.24.1",
    "trl>=1.19.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
